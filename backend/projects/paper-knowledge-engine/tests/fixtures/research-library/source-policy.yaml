date_lower_bound: 2026-01-01
source_kinds: [paper, technical-report, official-doc, specification, repository, release, evaluation-method, local-artifact]
allowed_domains: [arxiv.org, export.arxiv.org, openai.com, github.com, modelcontextprotocol.io]
identity_version_rules:
  paper: arxiv-id-and-version
  technical-report: canonical-url-and-revision
  official-doc: canonical-url-and-revision
  specification: name-and-version
  repository: normalized-url-and-commit-or-tag
  release: project-url-and-release-tag
  evaluation-method: canonical-url-and-revision
  local-artifact: content-sha256
max_response_bytes: 10485760
request_timeout_seconds: 30
max_attempts: 3
retain_all_versions: true
content_hash: sha256
