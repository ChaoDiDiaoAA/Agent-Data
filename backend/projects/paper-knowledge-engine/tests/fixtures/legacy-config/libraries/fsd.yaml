    - api migration
    - dependency migration
    - database migration
    - schema migration
    - semantic equivalence
    - behavior preservation
    - differential testing
    - coding agent benchmark
    - repository benchmark
  term_variants:
    large language model: [large language models]
    llm: [llms]
    code llm: [code llms]
    coding agent: [coding agents]
    llm agent: [llm agents]
    tool-using agent: [tool-using agents]
    knowledge graph: [knowledge graphs]
    graph rag: [graphrag]
    abstract syntax tree: [abstract syntax trees]
    ast: [asts]
    concrete syntax tree: [concrete syntax trees]
    cst: [csts]
    control flow graph: [control flow graphs]
    cfg: [cfgs]
    data flow graph: [data flow graphs]
    dfg: [dfgs]
    call graph: [call graphs]
    program dependency graph: [program dependency graphs]
    pdg: [pdgs]
    symbol table: [symbol tables]
    intermediate representation: [intermediate representations]
    requirements recovery: [requirement recovery]
    test oracle: [test oracles]
    characterization test: [characterization tests]
    domain model: [domain models]
    business rule: [business rules]
    bounded context: [bounded contexts]
    coding agent benchmark: [coding agent benchmarks]
