    - ast
    - concrete syntax tree
    - cst
    - control flow graph
    - cfg
    - data flow graph
    - dfg
    - call graph
    - program dependency graph
    - pdg
    - symbol table
    - type information
    - intermediate representation
    - ir
    - static analysis
    - dynamic analysis
