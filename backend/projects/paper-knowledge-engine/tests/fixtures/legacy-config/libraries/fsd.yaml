    AI-Program-Analysis-AST: { pdf: 05-AI-Program-Analysis-AST }
    Legacy-Modernization: { pdf: 06-Agentic-Legacy-Modernization }
    Code-Translation: { pdf: 07-LLM-Code-Translation }
